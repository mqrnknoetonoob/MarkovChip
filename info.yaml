project:
  title:       "MarkovChip"
  team:        "BUETCHIP"
  discord:     "AlFateh_36"
  description: "16-State 12-bit Stochastic Multi-Step Markov Transition Matrix Accelerator IP Block"
  lvs_config:  "lvs_config.json"

# =============================================================================
# Pin Definitions
# -----------------------------------------------------------------------------
# Placement order: clockwise starting bottom-left, per organizer spec.
# Order derived from RUN_for_35MHz/.../4-io.def PLACED coordinates.
#
# vdd/vss: left at default padframe positions (confirmed with Diganto —
#   no custom placement needed).
#----------------------------------------------------------------------------
# All outputs are bidirectional to allow for host-driven tri-state control.
# =============================================================================

pins:
  # Power rails
  - name: vdd
    io_type: power

  - name: vss
    io_type: ground

  - name: rst_n               # Active-low reset; Schmitt for noise immunity
    io_type: input_schmitt

  - name: clk                 # System clock
    io_type: input_cmos

  - name: spi_out0            # SPI output bit 0 (chip → host)
    io_type: bidirectional

  - name: load_row_or_col     # Selects row (0) or column (1) for SPI load
    io_type: input_cmos

  - name: spi_in1             # SPI input bit 1 (host → chip)
    io_type: input_cmos

  - name: spi_out3            # SPI output bit 3 (chip → host)
    io_type: bidirectional

  - name: input_ready         # Host signals data is ready on SPI inputs
    io_type: input_cmos

  - name: spi_in3             # SPI input bit 3 (host → chip)
    io_type: input_cmos

  - name: spi_in0             # SPI input bit 0 (host → chip)
    io_type: input_cmos

  - name: spi_in2             # SPI input bit 2 (host → chip)
    io_type: input_cmos

  - name: spi_out2            # SPI output bit 2 (chip → host)
    io_type: bidirectional

  - name: spi_out1            # SPI output bit 1 (chip → host)
    io_type: bidirectional

  - name: output_valid        # Host acknowledges chip output is valid/consumed
    io_type: input_cmos

  - name: output_ready        # Chip signals output data is ready (chip → host)
    io_type: bidirectional
